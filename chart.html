<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="echarts.min.js"></script>
    <style>
        body, html { height: 100%; margin: 0; overflow: hidden; background-color: #f0f2f5; }
        #main { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="main"></div>
    <script type="text/javascript">
        var myChart = echarts.init(document.getElementById('main'));
        var dataX = [];
        var dataY = [];
        var option = {
            title: { text: '课堂专注度实时趋势', left: 'center', top: 10 },
            tooltip: { trigger: 'axis' },
            grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
            xAxis: { type: 'category', boundaryGap: false, data: dataX },
            yAxis: { type: 'value', min: 0, max: 100, name: '专注指数' },
            series: [{
                data: dataY,
                type: 'line',
                smooth: true,
                areaStyle: { color: 'rgba(64, 158, 255, 0.2)' },
                lineStyle: { color: '#409EFF', width: 3 }
            }]
        };
        myChart.setOption(option);

        function updateChart(timeStr, score) {
            if (dataX.length > 20) { dataX.shift(); dataY.shift(); }
            dataX.push(timeStr);
            dataY.push(score);
            myChart.setOption({ xAxis: { data: dataX }, series: [{ data: dataY }] });
        }
    </script>
</body>
</html>
